<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>VexaChat — Offline</title><style>
:root{--bg:#07111f;--panel:#0a1727;--line:rgba(255,255,255,.08);--text:#f3f7fc;--muted:#8296ad;--accent:#35a9ff;--accent2:#6b63ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(53,169,255,.1),transparent 42%),var(--bg)}
.card{width:min(430px,100%);padding:24px;border:1px solid var(--line);border-radius:18px;background:rgba(10,23,39,.96);box-shadow:0 22px 60px rgba(0,0,0,.4);text-align:center}
.logo{width:68px;height:68px;border-radius:20px;margin-bottom:14px}.mark{font-size:10px;letter-spacing:1.2px;color:#70c9ff;font-weight:800}.card h1{margin:10px 0 7px;font-size:22px}.muted{margin:0;color:var(--muted);line-height:1.55;font-size:13px}
button{margin-top:18px;width:100%;height:44px;border:1px solid rgba(53,169,255,.25);border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(145deg,var(--accent),var(--accent2));cursor:pointer}
</style></head><body><main class="card"><img class="logo" src="./icon.svg" alt="VexaChat"><div class="mark">VEXACHAT</div><h1>You're offline</h1><p class="muted">Your connection to VexaChat is temporarily unavailable. Check your internet connection and try again.</p><button onclick="location.reload()">Try again</button></main></body></html>
