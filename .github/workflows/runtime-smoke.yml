name: VexaAccount production runtime smoke

on:
  push:
    branches: [fix/owner-os-startup-nonblocking]

permissions:
  contents: write

jobs:
  patch-owner-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          ref: fix/owner-os-startup-nonblocking
      - name: Apply Owner OS startup hydration fix
        run: python3 scripts/one-shot-owner-boot-fix.py
      - name: Commit only the source fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/one-shot-owner-boot-fix.py .github/workflows/one-shot-owner-boot-fix.yml
          git add frontend-VexaAccount-Super-admin/src/owner-os.js scripts/one-shot-owner-boot-fix.py .github/workflows/one-shot-owner-boot-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(owner-os): make startup hydration truly non-blocking'
          git push origin HEAD:fix/owner-os-startup-nonblocking
