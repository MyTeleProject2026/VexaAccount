name: VexaAccount production runtime smoke

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health and database dependency
        env:
          VEXA_API_BASE: ${{ vars.VEXA_API_BASE || 'https://api-vexaaccount.onrender.com' }}
        run: |
          set -euo pipefail
          base="${VEXA_API_BASE%/}"
          body="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --max-time 45 "$base/api/health")"
          echo "$body"
          node -e 'const d=JSON.parse(process.argv[1]); if(d.success!==true || d.status!=="healthy" || d.checks?.database!=="ok" || d.checks?.server!=="ok") process.exit(1)' "$body"
      - name: Check public authentication contracts at runtime
        env:
          VEXA_API_BASE: ${{ vars.VEXA_API_BASE || 'https://api-vexaaccount.onrender.com' }}
        run: |
          set -euo pipefail
          base="${VEXA_API_BASE%/}"
          check_endpoint() {
            local name="$1"
            local expected="$2"
            local url="$3"
            shift 3
            local body_file="/tmp/${name}-body"
            local code
            code="$(curl --silent --show-error --location --retry 3 --retry-delay 3 --max-time 30 -o "$body_file" -w '%{http_code}' "$@" "$url")"
            echo "$name HTTP status: $code"
            cat "$body_file"
            echo
            test "$code" = "$expected"
          }
          check_endpoint login 400 "$base/api/auth/login" -H 'Content-Type: application/json' -d '{}'
          check_endpoint register 400 "$base/api/auth/register" -H 'Content-Type: application/json' -d '{}'
          check_endpoint sso-authorize 401 "$base/api/sso/authorize"
      - name: Check user frontend serves canonical runtime
        env:
          VEXA_USER_BASE: ${{ vars.VEXA_USER_BASE || 'https://vexaaccount-management.onrender.com' }}
        run: |
          set -euo pipefail
          base="${VEXA_USER_BASE%/}"
          html="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --max-time 45 "$base/")"
          for asset in account-center-runtime-v2.js functional-runtime-bridge.js account-workflow-bridge.js sso-frontend.js auth-session-bridge.js; do
            printf '%s' "$html" | grep -q "$asset" || { echo "Canonical user runtime asset is not referenced by production HTML: $asset"; exit 1; }
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 "$base/src/$asset" >/dev/null || { echo "Production user runtime asset is not reachable: $asset"; exit 1; }
          done
      - name: Check Super Admin frontend serves canonical Owner OS
        env:
          VEXA_OWNER_BASE: ${{ vars.VEXA_OWNER_BASE || 'https://super-admin-vexaaccount.onrender.com' }}
        run: |
          set -euo pipefail
          base="${VEXA_OWNER_BASE%/}"
          html="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 --max-time 45 "$base/")"
          for asset in owner-os.js sso-integration-factory-v4.js; do
            printf '%s' "$html" | grep -q "$asset" || { echo "Canonical Owner OS asset is not referenced by production HTML: $asset"; exit 1; }
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 "$base/src/$asset" >/dev/null || { echo "Production Owner OS asset is not reachable: $asset"; exit 1; }
          done
