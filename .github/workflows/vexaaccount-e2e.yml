name: VexaAccount production E2E
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      HAS_AUTH_E2E: ${{ secrets.VEXA_E2E_USER_EMAIL != '' && secrets.VEXA_E2E_USER_PASSWORD != '' && secrets.VEXA_E2E_OWNER_EMAIL != '' && secrets.VEXA_E2E_OWNER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deployed API and security smoke checks
        env:
          VEXA_ACCOUNT_BASE_URL: https://api-vexaaccount.onrender.com
        run: node scripts/e2e-production-smoke.js
      - name: Run authenticated support-to-notification E2E
        if: ${{ env.HAS_AUTH_E2E == 'true' }}
        env:
          VEXA_ACCOUNT_BASE_URL: https://api-vexaaccount.onrender.com
          VEXA_E2E_USER_EMAIL: ${{ secrets.VEXA_E2E_USER_EMAIL }}
          VEXA_E2E_USER_PASSWORD: ${{ secrets.VEXA_E2E_USER_PASSWORD }}
          VEXA_E2E_OWNER_EMAIL: ${{ secrets.VEXA_E2E_OWNER_EMAIL }}
          VEXA_E2E_OWNER_PASSWORD: ${{ secrets.VEXA_E2E_OWNER_PASSWORD }}
        run: node scripts/e2e-support-notification.js
      - name: Report authenticated E2E configuration status
        if: ${{ always() }}
        run: |
          if [ "$HAS_AUTH_E2E" = "true" ]; then
            echo "Authenticated production support/notification E2E was configured for this run."
          else
            echo "Authenticated production support/notification E2E was skipped because its four test credentials are not configured."
          fi
