name: One-shot Owner OS boot fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-owner-boot-fix.yml'

permissions:
  contents: write

jobs:
  patch-owner-boot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: master
      - name: Apply exact Owner OS source patch
        run: python3 scripts/one-shot-owner-boot-fix.py
      - name: Commit source patch and restore workflow files
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=cb0fe2618b090f1e94017593a5a1b0353467b41e -- .github/workflows/runtime-smoke.yml
          rm -f .github/workflows/one-shot-owner-boot-fix.yml scripts/one-shot-owner-boot-fix.py
          git add frontend-VexaAccount-Super-admin/src/owner-os.js .github/workflows/runtime-smoke.yml .github/workflows/one-shot-owner-boot-fix.yml scripts/one-shot-owner-boot-fix.py
          git diff --cached --check
          git commit -m "fix(owner-os): make startup hydration truly non-blocking"
          git push origin master
