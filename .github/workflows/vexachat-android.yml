name: VexaChat Android

on:
  push:
    branches: [master, feature/vexachat-complete]
    paths:
      - 'frontend-VexaChat/**'
      - 'backend/src/routes/vexachat.js'
      - 'backend/database/migrations/20261001_vexachat.sql'
      - 'packaging/vexachat/**'
      - '.github/workflows/vexachat-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-VexaChat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: test -f index.html && test -f app.js && test -f styles.css

  build-apk:
    needs: verify-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging/vexachat/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle :app:assembleRelease -PVEXACHAT_WEB_URL=${{ vars.VEXACHAT_WEB_URL || 'https://vexachat.onrender.com' }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VexaChat-Android
          path: packaging/vexachat/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
