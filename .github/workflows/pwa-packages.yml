name: VexaAccount PWA packages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('frontend-VexaAccount-user/public/manifest.json','utf8'));for(const k of ['name','short_name','start_url','scope','display','theme_color','background_color'])if(!m[k])throw Error('Missing '+k);if(m.display!=='standalone')throw Error('display must be standalone');for(const i of m.icons||[])if(!['192x192','512x512'].includes(i.sizes)||i.type!=='image/png')throw Error('Invalid production icon declaration');console.log('PWA manifest OK')"
      - name: Validate required PWA assets
        run: |
          test -f frontend-VexaAccount-user/sw.js
          test -f frontend-VexaAccount-user/offline.html
          test -f frontend-VexaAccount-user/public/icons/icon-192.png
          test -f frontend-VexaAccount-user/public/icons/icon-512.png
      - name: Upload PWA packaging inputs
        uses: actions/upload-artifact@v7
        with:
          name: vexaaccount-pwa-packaging-inputs
          if-no-files-found: error
          path: |
            frontend-VexaAccount-user/public/manifest.json
            frontend-VexaAccount-user/public/icons/*.png
            frontend-VexaAccount-user/sw.js
            frontend-VexaAccount-user/offline.html
            frontend-VexaAccount-user/packaging/android/twa-manifest.json
  android-project-build:
    needs: validate-pwa
    runs-on: ubuntu-latest
    env:
      USER_KEYSTORE_PATH: ${{ github.workspace }}/.release-keystores/user.jks
      USER_KEYSTORE_PASSWORD: ${{ secrets.VEXAACCOUNT_USER_KEYSTORE_PASSWORD }}
      USER_KEY_ALIAS: ${{ secrets.VEXAACCOUNT_USER_KEY_ALIAS }}
      USER_KEY_PASSWORD: ${{ secrets.VEXAACCOUNT_USER_KEY_PASSWORD }}
      OWNER_KEYSTORE_PATH: ${{ github.workspace }}/.release-keystores/super-admin.jks
      OWNER_KEYSTORE_PASSWORD: ${{ secrets.VEXAACCOUNT_SUPER_ADMIN_KEYSTORE_PASSWORD }}
      OWNER_KEY_ALIAS: ${{ secrets.VEXAACCOUNT_SUPER_ADMIN_KEY_ALIAS }}
      OWNER_KEY_PASSWORD: ${{ secrets.VEXAACCOUNT_SUPER_ADMIN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Restore and verify release keystores
        env:
          USER_KEYSTORE_BASE64: ${{ secrets.VEXAACCOUNT_USER_KEYSTORE_BASE64 }}
          OWNER_KEYSTORE_BASE64: ${{ secrets.VEXAACCOUNT_SUPER_ADMIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${USER_KEYSTORE_BASE64:?Missing VEXAACCOUNT_USER_KEYSTORE_BASE64 repository secret}"
          : "${USER_KEYSTORE_PASSWORD:?Missing VEXAACCOUNT_USER_KEYSTORE_PASSWORD repository secret}"
          : "${USER_KEY_ALIAS:?Missing VEXAACCOUNT_USER_KEY_ALIAS repository secret}"
          : "${USER_KEY_PASSWORD:?Missing VEXAACCOUNT_USER_KEY_PASSWORD repository secret}"
          : "${OWNER_KEYSTORE_BASE64:?Missing VEXAACCOUNT_SUPER_ADMIN_KEYSTORE_BASE64 repository secret}"
          : "${OWNER_KEYSTORE_PASSWORD:?Missing VEXAACCOUNT_SUPER_ADMIN_KEYSTORE_PASSWORD repository secret}"
          : "${OWNER_KEY_ALIAS:?Missing VEXAACCOUNT_SUPER_ADMIN_KEY_ALIAS repository secret}"
          : "${OWNER_KEY_PASSWORD:?Missing VEXAACCOUNT_SUPER_ADMIN_KEY_PASSWORD repository secret}"
          mkdir -p "$(dirname "$USER_KEYSTORE_PATH")" "$(dirname "$OWNER_KEYSTORE_PATH")"
          printf '%s' "$USER_KEYSTORE_BASE64" | base64 --decode > "$USER_KEYSTORE_PATH"
          printf '%s' "$OWNER_KEYSTORE_BASE64" | base64 --decode > "$OWNER_KEYSTORE_PATH"
          chmod 600 "$USER_KEYSTORE_PATH" "$OWNER_KEYSTORE_PATH"
          keytool -list -keystore "$USER_KEYSTORE_PATH" -storepass "$USER_KEYSTORE_PASSWORD" -alias "$USER_KEY_ALIAS" >/dev/null
          keytool -list -keystore "$OWNER_KEYSTORE_PATH" -storepass "$OWNER_KEYSTORE_PASSWORD" -alias "$OWNER_KEY_ALIAS" >/dev/null
          echo "VexaAccount User and Super Admin release keystores and aliases verified."
      - name: Build VexaAccount User APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleUserRelease bundleUserRelease
      - name: Build VexaAccount Super Admin APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleOwnerRelease bundleOwnerRelease
      - name: Verify release binaries
        working-directory: packaging/android
        run: |
          set -euo pipefail
          for pattern in 'app/build/outputs/apk/user/release/*.apk' 'app/build/outputs/apk/owner/release/*.apk' 'app/build/outputs/bundle/userRelease/*.aab' 'app/build/outputs/bundle/ownerRelease/*.aab'; do
            matches=( $pattern )
            [ -e "${matches[0]}" ] || { echo "Missing release binary: $pattern" >&2; exit 1; }
          done
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec stat -c '%n %s bytes' {} \;
          while IFS= read -r f; do
            size=$(stat -c '%s' "$f")
            [ "$size" -gt 100000 ] || { echo "Release binary is unexpectedly small: $f ($size bytes)" >&2; exit 1; }
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \))
      - uses: actions/upload-artifact@v7
        with:
          name: vexaaccount-android-release
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/user/release/*.apk
            packaging/android/app/build/outputs/apk/owner/release/*.apk
            packaging/android/app/build/outputs/bundle/userRelease/*.aab
            packaging/android/app/build/outputs/bundle/ownerRelease/*.aab
  store-package-note:
    needs: validate-pwa
    runs-on: ubuntu-latest
    steps:
      - run: echo "PWA validation and native Android APK/AAB packaging are configured for the VexaAccount User and Super Admin applications."
