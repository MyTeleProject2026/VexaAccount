name: VexaAccount PWA packages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('frontend-VexaAccount-user/public/manifest.json','utf8'));for(const k of ['name','short_name','start_url','scope','display','theme_color','background_color'])if(!m[k])throw Error('Missing '+k);if(m.display!=='standalone')throw Error('display must be standalone');for(const i of m.icons||[])if(!['192x192','512x512'].includes(i.sizes)||i.type!=='image/png')throw Error('Invalid production icon declaration');console.log('PWA manifest OK')"
      - name: Validate required PWA assets
        run: |
          test -f frontend-VexaAccount-user/sw.js
          test -f frontend-VexaAccount-user/offline.html
          test -f frontend-VexaAccount-user/public/icons/icon-192.png
          test -f frontend-VexaAccount-user/public/icons/icon-512.png
      - name: Upload PWA packaging inputs
        uses: actions/upload-artifact@v4
        with:
          name: vexaaccount-pwa-packaging-inputs
          path: |
            frontend-VexaAccount-user/public/manifest.json
            frontend-VexaAccount-user/public/icons/*.png
            frontend-VexaAccount-user/sw.js
            frontend-VexaAccount-user/offline.html
            frontend-VexaAccount-user/packaging/android/twa-manifest.json

  android-project-build:
    needs: validate-pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build VexaAccount User APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleUserRelease bundleUserRelease
      - name: Build VexaAccount Owner APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleOwnerRelease bundleOwnerRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vexaaccount-android-release
          path: |
            packaging/android/app/build/outputs/apk/user/release/*.apk
            packaging/android/app/build/outputs/apk/owner/release/*.apk
            packaging/android/app/build/outputs/bundle/userRelease/*.aab
            packaging/android/app/build/outputs/bundle/ownerRelease/*.aab

  store-package-note:
    needs: validate-pwa
    runs-on: ubuntu-latest
    steps:
      - run: echo "PWA validation and native Android APK/AAB packaging are configured for the VexaAccount web applications."
