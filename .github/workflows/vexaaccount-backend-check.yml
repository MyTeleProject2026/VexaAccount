name: VexaAccount Backend Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vexaccount
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vexaccount/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check backend syntax
        run: npm run check
