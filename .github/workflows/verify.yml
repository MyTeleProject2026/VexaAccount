name: VexaAccount verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check user frontend JavaScript syntax
        run: find frontend-VexaAccount-user/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Super Admin JavaScript syntax
        run: find frontend-VexaAccount-Super-admin/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify secure OTP generation across account workflows
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['backend/src/routes/auth.js','backend/src/routes/auth-recovery.js','backend/src/routes/account-change-flows.js','backend/src/routes/account-recovery-email.js','backend/src/routes/account-profile.js'];
          for(const p of files){const s=fs.readFileSync(p,'utf8');if(s.includes('Math.random')){console.error('Insecure Math.random OTP generation remains in:',p);process.exit(1)}}
          const secure=[['backend/src/routes/auth.js','crypto.randomInt'],['backend/src/routes/auth-recovery.js','crypto.randomInt'],['backend/src/routes/account-change-flows.js','crypto.randomInt(100000,1000000)'],['backend/src/routes/account-recovery-email.js','crypto.randomInt(100000,1000000)'],['backend/src/routes/account-profile.js','crypto.randomInt(100000, 1000000)']];
          for(const [p,needle] of secure){if(!fs.readFileSync(p,'utf8').includes(needle)){console.error('Secure OTP contract missing:',p,needle);process.exit(1)}}
          NODE
      - name: Verify canonical SSO integration factory contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='frontend-VexaAccount-Super-admin/src/sso-integration-factory-v4.js';
          const s=fs.readFileSync(p,'utf8');
          const required=['Node / Express','FastAPI','Django','VEXA_ACCOUNT_CLIENT_SECRET=PASTE_ONE_TIME_SECRET_HERE','code_challenge','code_challenge_method','S256','code_verifier','/api/sso/token','/api/sso/userinfo','/api/sso/logout','integration-patch-manifest.json'];
          for(const x of required)if(!s.includes(x)){console.error('SSO factory missing contract:',x);process.exit(1)}
          if(s.includes('localStorage')||s.includes('sessionStorage')){console.error('SSO factory must not persist credentials in browser storage');process.exit(1)}
          NODE
      - name: Verify account security route mounting and recovery workflow contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('backend/src/index.js','utf8');
          const recovery=fs.readFileSync('backend/src/routes/account-recovery-email.js','utf8');
          const people=fs.readFileSync('backend/src/routes/account-people.js','utf8');
          for(const required of ["require('./routes/account-recovery-email')","require('./routes/account-people')","app.use('/api/account',accountRecoveryEmailRoutes)","app.use('/api/account',accountPeopleRoutes)"]){if(!index.includes(required)){console.error('Missing account route mount contract:',required);process.exit(1)}}
          for(const required of ['/recovery','/recovery/confirm','/recovery/test','crypto.randomInt(100000,1000000)','requiresVerification:true','vexa_account_recovery_email_changes']){if(!recovery.includes(required)){console.error('Recovery workflow missing contract:',required);process.exit(1)}}
          if(recovery.includes('Math.random')){console.error('Recovery OTP must not use Math.random');process.exit(1)}
          for(const required of ['/people','location_sharing_enabled','personalization_enabled','activity_history_enabled','push_notifications_enabled','product_updates_enabled','marketing_email_enabled','security_email_enabled','RECOVERY_EMAIL_VERIFICATION_REQUIRED']){if(!people.includes(required)){console.error('People workflow missing contract:',required);process.exit(1)}}
          NODE
      - name: Verify account credential mutation routes use verified change workflows
        run: |
          node <<'NODE'
          const fs=require('fs');
          const profile=fs.readFileSync('backend/src/routes/account-profile.js','utf8');
          const changes=fs.readFileSync('backend/src/routes/account-change-flows.js','utf8');
          for(const required of ['/email','/password','USE_VERIFIED_CHANGE_FLOW'])if(!profile.includes(required)){console.error('Legacy credential route guard missing:',required);process.exit(1)}
          for(const required of ['/email/start','/email/verify','/email/resend','/password/start','/password/verify','/password/resend','crypto.randomInt(100000,1000000)'])if(!changes.includes(required)){console.error('Verified credential workflow missing:',required);process.exit(1)}
          if(profile.includes('Math.random')){console.error('Profile route must not use Math.random');process.exit(1)}
          if(profile.includes('UPDATE store_users SET email=')||profile.includes('UPDATE store_users SET password=')){console.error('Legacy profile route must not directly mutate credentials');process.exit(1)}
          NODE
      - name: Verify SSO authorization and token lifecycle contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sso=fs.readFileSync('backend/src/routes/sso.js','utf8');
          const auth=fs.readFileSync('backend/src/middleware/ssoUserAuth.js','utf8');
          for(const required of ["codeChallengeMethod !== 'S256'",'consumed_at IS NULL','FOR UPDATE','PKCE verification failed','UPDATE sso_authorization_codes SET consumed_at=NOW()','UPDATE sso_refresh_tokens SET revoked_at=NOW()','sso_refresh_tokens','token_hash','crypto.randomBytes','session_version','decoded.sv','Invalid, inactive, or revoked SSO token'])if(!sso.includes(required)){console.error('SSO lifecycle contract missing:',required);process.exit(1)}
          for(const required of ["require('../config/database')",'async function requireSsoUser','session_version','is_active=1','Invalid, inactive, or revoked session'])if(!auth.includes(required)){console.error('SSO authorization user-session contract missing:',required);process.exit(1)}
          NODE
      - name: Verify server-side JWT invalidation contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const migration=fs.readFileSync('backend/database/migrations/20260907_session_version.sql','utf8');
          const auth=fs.readFileSync('backend/src/middleware/auth.js','utf8');
          const recovery=fs.readFileSync('backend/src/routes/auth-recovery.js','utf8');
          const center=fs.readFileSync('backend/src/routes/account-center.js','utf8');
          const profile=fs.readFileSync('backend/src/routes/account-profile.js','utf8');
          for(const required of ['ADD COLUMN session_version','DEFAULT 1'])if(!migration.includes(required)){console.error('Session version migration missing:',required);process.exit(1)}
          for(const required of ['session_version','decoded.sv','revoked user session'])if(!auth.includes(required)){console.error('JWT session-version middleware contract missing:',required);process.exit(1)}
          for(const required of ["sv: Number(user.session_version || 1)","router.post('/reset-password'",'purpose !== \'password_reset\'','is_used=0','session_version=COALESCE(session_version,1)+1','account.password_reset'])if(!recovery.includes(required)){console.error('Reset/session contract missing:',required);process.exit(1)}
          for(const required of ['router.use(authUser)','session_version=COALESCE(session_version,1)+1'])if(!center.includes(required)){console.error('Account center session contract missing:',required);process.exit(1)}
          for(const required of ['router.use(authUser)','is_active=0,session_version=COALESCE(session_version,1)+1'])if(!profile.includes(required)){console.error('Account deletion contract missing:',required);process.exit(1)}
          NODE
      - name: Verify protected JWT middleware rejects inactive users
        run: |
          node <<'NODE'
          const fs=require('fs');
          const auth=fs.readFileSync('backend/src/middleware/auth.js','utf8');
          for(const required of ["require('../config/database')",'requireActiveUser','SELECT id,email,is_active,session_version FROM store_users','is_active=1','Invalid, expired, inactive, or revoked user session'])if(!auth.includes(required)){console.error('Protected JWT active-user contract missing:',required);process.exit(1)}
          if(!/const authUser = async/.test(auth)){console.error('authUser must be async so active user state is checked');process.exit(1)}
          NODE
      - name: Verify security-sensitive account operations
        run: |
          node <<'NODE'
          const fs=require('fs');
          const deactivate=fs.readFileSync('backend/src/routes/account-deactivate.js','utf8');
          const profile=fs.readFileSync('backend/src/routes/account-profile.js','utf8');
          const center=fs.readFileSync('backend/src/routes/account-center.js','utf8');
          const score=fs.readFileSync('backend/src/routes/account-security-score.js','utf8');
          for(const required of ['bcrypt.compare(password','Current password is required','UPDATE store_users SET is_active=0','UPDATE sso_sessions SET revoked_at=NOW()','UPDATE sso_consents SET revoked_at=NOW()','account.deactivated'])if(!deactivate.includes(required)){console.error('Account deactivation security contract missing:',required);process.exit(1)}
          for(const required of ['/security/2fa/setup','/security/2fa/enable','/security/passcode/enable','/security/disable-2fa','/security/disable-passcode','bcrypt.hash(passcode,12)','authenticator.check'])if(!profile.includes(required)){console.error('Security control contract missing:',required);process.exit(1)}
          for(const required of ['/sessions','/apps/:clientId/consent','sso.session_revoked','sso.application_access_revoked'])if(!center.includes(required)){console.error('Session or application revocation contract missing:',required);process.exit(1)}
          for(const required of ['twofa_enabled','passcode_enabled','recovery_email','phone'])if(!score.includes(required)){console.error('Security score contract missing:',required);process.exit(1)}
          NODE
      - name: Verify user account workflow bridge contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-user/index.html','utf8');
          const bridge=fs.readFileSync('frontend-VexaAccount-user/src/account-workflow-bridge.js','utf8');
          if(!html.includes('account-workflow-bridge.js')){console.error('User index must load the account workflow bridge');process.exit(1)}
          for(const required of ['/api/account/recovery','/api/account/recovery/confirm','/api/account/people'])if(!bridge.includes(required)){console.error('Account workflow bridge missing contract:',required);process.exit(1)}
          NODE
      - name: Enforce canonical user runtime entrypoint and clean tree
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-user/index.html','utf8');
          const required=['account-center-fetch-guard.js','app.js','auth-session-bridge.js','account-center-toast-guard.js','vexa-notify-bridge.js','functional-runtime-bridge.js','sso-frontend.js','account-center-loader.js','account-workflow-bridge.js','notification-live-runtime.js','pwa.js'];
          for(const file of required){if(!html.includes(file)){console.error('Missing canonical user runtime script:',file);process.exit(1)}}
          const forbidden=['app-v3.js','app-fixed.js','auth-flow-fix.js','account-center-runtime.js','account-center-full-workflows.js','account-center-runtime-bridge.js','account-center-runtime-fix.js','account-center-network-guard.js','account-center-hotfix.js','account-center-live-metrics.js','account-center-ui-stability.js','notification-runtime.js','react-account-center-loader.js','react-account-center.js','vexatrade-toast-runtime.js','vexatrade-toast-compat.js','account-center-action-wiring.js','account-center-enhancements.js'];
          for(const file of forbidden){if(html.includes(file)){console.error('Legacy runtime loaded by user index:',file);process.exit(1)}}
          if((html.match(/account-center-fetch-guard\.js/g)||[]).length!==1){console.error('Fetch guard must load exactly once');process.exit(1)}
          const bridge=fs.readFileSync('frontend-VexaAccount-user/src/auth-session-bridge.js','utf8');
          if(!bridge.includes("credentials:'include'")){console.error('Session bridge must send credentials for HttpOnly cookie sessions');process.exit(1)}
          if(!bridge.includes('/api/auth/session')){console.error('Session bridge must validate the canonical session endpoint');process.exit(1)}
          NODE
      - name: Enforce canonical Owner OS entrypoint and clean tree
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-Super-admin/index.html','utf8');
          const required=['owner-os.js','owner-os.css','sso-integration-generator.js','sso-runtime-sync.js','sso-status-sync.js','sso-integration-factory-v4.js','sso-github-deployer.js','sso-application-kit-ui.js','owner-application-kit-actions.js','sso-application-planner-ui.js','sso-application-integration-builder.js','sso-application-builder-launcher.js','sso-diagnostics-panel.js','owner-sso-security-control-center.js'];
          for(const file of required){if(!html.includes(file)){console.error('Missing canonical Owner OS SSO asset:',file);process.exit(1)}}
          const forbidden=['owner-console-runtime.js','owner-control-center-loader.js','owner-control-center.js','src/app.js','sso-control-upgrade.js','sso-create-wizard.js','sso-integration-patch.js','sso-receipt-security.js','user-management.js','support-control.js','platform-settings.js','react-notification-bridge.js','premium-interactions.js','vexatrade-notifications.js','vexatrade-notifications.css','user-management.css','sso-integration-factory-v3.js'];
          for(const file of forbidden){if(html.includes(file)){console.error('Legacy Owner runtime loaded by index:',file);process.exit(1)}}
          const owner=fs.readFileSync('frontend-VexaAccount-Super-admin/src/owner-os.js','utf8');
          for(const required of ['/api/auth/super-admin/login','/api/auth/super-admin/session','/api/sso-registry/applications','/api/sso-registry/applications/','/api/owner/users','/api/owner/support/tickets','/api/owner/platform/health'])if(!owner.includes(required)){console.error('Owner OS missing required API contract:',required);process.exit(1)}
          if(/localStorage\.(setItem|getItem)\([^)]*clientSecret|sessionStorage\.(setItem|getItem)\([^)]*clientSecret/.test(owner)){console.error('Client secret must not be stored in browser storage');process.exit(1)}
          if(/location\.(href|assign|replace)[^;\n]*clientSecret/.test(owner)){console.error('Client secret must not be placed in URLs');process.exit(1)}
          const deployer=fs.readFileSync('frontend-VexaAccount-Super-admin/src/sso-github-deployer.js','utf8');
          for(const required of ['/api/sso-integration/status','/api/sso-integration/preflight','/api/sso-integration/deploy'])if(!deployer.includes(required)){console.error('Missing deployment API contract:',required);process.exit(1)}
          NODE
      - name: Verify root entrypoint is only a canonical redirect
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('./frontend-VexaAccount-user/')){console.error('Root entrypoint must redirect to the canonical user frontend');process.exit(1)}
          if(fs.existsSync('src/account-center-loader.js')||fs.existsSync('src/account-center-fetch-guard.js')){console.error('Duplicate root Account Center runtime files must not exist');process.exit(1)}
          NODE
      - name: Verify Owner OS entrypoint has no inline JavaScript or stacked fetch wrappers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-Super-admin/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          for(const m of scripts){
            const attrs=m[1]||'';
            const body=(m[2]||'').trim();
            if(!/\bsrc=/.test(attrs)&&body){
              console.error('Owner index must not contain inline JavaScript');
              process.exit(1);
            }
          }
          const files=['owner-runtime-loader.js','owner-login-resilience.js','owner-auth-native-boundary.js','owner-os-runtime-guard.js'];
          for(const file of files){
            const s=fs.readFileSync('frontend-VexaAccount-Super-admin/src/'+file,'utf8');
            if(/window\.fetch\s*=/.test(s)){
              console.error('Stacked global fetch wrapper is forbidden:',file);
              process.exit(1);
            }
          }
          NODE
