name: VexaAccount verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check user frontend JavaScript syntax
        run: find frontend-VexaAccount-user/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Super Admin JavaScript syntax
        run: find frontend-VexaAccount-Super-admin/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify SSO integration factory contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='frontend-VexaAccount-Super-admin/src/sso-integration-factory-v3.js';
          const s=fs.readFileSync(p,'utf8');
          const required=['VexaMail','VexaWallet','VexaCloud','Vexa Password Manager','VexaAuthenticator','VexaWholes Professional','nodeExpress','nextjs','fastapi','django','backend/.env.example','tests/vexaaccount-sso.e2e.test.js','deployment/vexaaccount-sso.md','integration-patch-manifest.json','database/vexaaccount-sso.sql','VEXA_ACCOUNT_CLIENT_SECRET=PASTE_ONE_TIME_SECRET_HERE'];
          for(const x of required)if(!s.includes(x)){console.error('SSO factory missing contract:',x);process.exit(1)}
          if(s.includes('localStorage')||s.includes('sessionStorage')){console.error('SSO factory must not persist credentials in browser storage');process.exit(1)}
          if(!s.includes("/api/sso/token")||!s.includes("/api/sso/userinfo")||!s.includes("/api/sso/authorize")){console.error('SSO factory missing provider endpoints');process.exit(1)}
          NODE
      - name: Enforce canonical user runtime entrypoint and clean tree
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-user/index.html','utf8');
          const required=['account-center-fetch-guard.js','app.js','auth-session-bridge.js','account-center-toast-guard.js','vexa-notify-bridge.js','sso-frontend.js','account-center-loader.js','notification-live-runtime.js','pwa.js'];
          for(const file of required){if(!html.includes(file)){console.error('Missing canonical user runtime script:',file);process.exit(1)}}
          const forbidden=['app-v3.js','app-fixed.js','auth-flow-fix.js','account-center-runtime.js','account-center-full-workflows.js','account-center-runtime-bridge.js','account-center-runtime-fix.js','account-center-network-guard.js','account-center-hotfix.js','account-center-live-metrics.js','account-center-ui-stability.js','notification-runtime.js','react-account-center-loader.js','react-account-center.js','vexatrade-toast-runtime.js','vexatrade-toast-compat.js','account-center-action-wiring.js','account-center-enhancements.js'];
          for(const file of forbidden){if(html.includes(file)){console.error('Legacy runtime loaded by user index:',file);process.exit(1)}}
          if((html.match(/account-center-fetch-guard\.js/g)||[]).length!==1){console.error('Fetch guard must load exactly once');process.exit(1)}
          NODE
      - name: Enforce canonical Owner OS entrypoint and clean tree
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-Super-admin/index.html','utf8');
          for(const file of ['owner-os.js','owner-os.css','sso-integration-generator.js','sso-runtime-sync.js','sso-status-sync.js','sso-integration-factory-v3.js','sso-github-deployer.js']){if(!html.includes(file)){console.error('Missing canonical Owner OS asset:',file);process.exit(1)}}
          const forbidden=['owner-console-runtime.js','owner-control-center-loader.js','owner-control-center.js','sso-diagnostics-panel.js','src/app.js','sso-control-upgrade.js','sso-create-wizard.js','sso-integration-patch.js','sso-receipt-security.js','user-management.js','support-control.js','platform-settings.js','react-notification-bridge.js','premium-interactions.js','vexatrade-notifications.js','vexatrade-notifications.css','user-management.css'];
          for(const file of forbidden){if(html.includes(file)){console.error('Legacy Owner runtime loaded by index:',file);process.exit(1)}}
          const owner=fs.readFileSync('frontend-VexaAccount-Super-admin/src/owner-os.js','utf8');
          for(const required of ['/api/auth/super-admin/login','/api/auth/super-admin/session','/api/sso-registry/applications','/api/sso-registry/applications/','/api/owner/users','/api/owner/support/tickets','/api/owner/platform/health'])if(!owner.includes(required)){console.error('Owner OS missing required API contract:',required);process.exit(1)}
          if(/localStorage\.(setItem|getItem)\([^)]*clientSecret|sessionStorage\.(setItem|getItem)\([^)]*clientSecret/.test(owner)){console.error('Client secret must not be stored in browser storage');process.exit(1)}
          if(/location\.(href|assign|replace)[^;\n]*clientSecret/.test(owner)){console.error('Client secret must not be placed in URLs');process.exit(1)}
          const deployer=fs.readFileSync('frontend-VexaAccount-Super-admin/src/sso-github-deployer.js','utf8');
          for(const required of ['/api/sso-integration/status','/api/sso-integration/preflight','/api/sso-integration/deploy'])if(!deployer.includes(required)){console.error('Missing deployment API contract:',required);process.exit(1)}
          NODE
      - name: Verify root entrypoint is only a canonical redirect
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('./frontend-VexaAccount-user/')){console.error('Root entrypoint must redirect to the canonical user frontend');process.exit(1)}
          if(fs.existsSync('src/account-center-loader.js')||fs.existsSync('src/account-center-fetch-guard.js')){console.error('Duplicate root Account Center runtime files must not exist');process.exit(1)}
          NODE
