name: VexaAccount verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check user frontend JavaScript syntax
        run: find frontend-VexaAccount-user/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Super Admin JavaScript syntax
        run: find frontend-VexaAccount-Super-admin/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify canonical user runtime
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-user/index.html','utf8');
          const required=['account-center-fetch-guard.js','app.js','auth-session-bridge.js','account-center-toast-guard.js','vexa-notify-bridge.js','functional-runtime-bridge.js','sso-frontend.js','account-center-loader.js','account-workflow-bridge.js','notification-live-runtime.js','pwa.js'];
          for(const x of required)if(!html.includes(x)){console.error('Missing canonical user runtime:',x);process.exit(1)}
          const scriptTags=[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']*account-center-fetch-guard\.js(?:\?[^"']*)?)["'][^>]*>/gi)];
          if(scriptTags.length!==1){console.error('User fetch guard script tag must load exactly once; found',scriptTags.length);process.exit(1)}
          NODE
      - name: Verify canonical Owner operation runtime
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend-VexaAccount-Super-admin/index.html','utf8');
          const required=['owner-os.js','owner-os.css','sso-runtime-sync.js','sso-integration-factory-v4.js','sso-github-deployer.js','sso-application-kit-ui.js','owner-application-kit-actions.js','sso-application-planner-async-v2.js','sso-application-integration-builder.js','sso-application-builder-launcher.js','sso-diagnostics-panel.js','owner-sso-security-control-center.js','owner-operation-runtime.js','owner-operation-center-ui.js','owner-operation-nonblocking-guard.js','owner-operation-workspace-ui.js','owner-source-repair-runtime-guard.js','owner-source-repair.js'];
          for(const x of required)if(!html.includes(x)){console.error('Missing canonical Owner runtime:',x);process.exit(1)}
          const obsolete=['sso-status-sync.js','sso-application-planner-ui.js','owner-console-runtime.js','owner-control-center-loader.js','owner-control-center.js','sso-control-upgrade.js','sso-create-wizard.js','sso-integration-patch.js','sso-receipt-security.js','sso-integration-factory-v3.js'];
          for(const x of obsolete)if(html.includes(x)){console.error('Obsolete runtime still loaded:',x);process.exit(1)}
          NODE
      - name: Verify no global fetch replacement or document-wide input observer
        run: |
          if grep -RInE 'window\.fetch[[:space:]]*=|new MutationObserver' frontend-VexaAccount-Super-admin/src; then
            echo 'Unsafe global runtime hook detected'; exit 1;
          fi
      - name: Verify durable operation service
        run: |
          node <<'NODE'
          const fs=require('fs');
          const op=fs.readFileSync('backend/src/services/ownerOperation.service.js','utf8');
          for(const x of ['registerRunner','initialize','listPersistent','getPersistent','cancelPersistent','execute','worker_id','lease_until','attempt_count','heartbeat'])if(!op.includes(x)){console.error('Missing durable operation contract:',x);process.exit(1)}
          NODE
      - name: Verify async analyzer routes
        run: |
          node <<'NODE'
          const fs=require('fs');
          const route=fs.readFileSync('backend/src/routes/sso-application-analyzer.js','utf8');
          for(const x of ['/analyze/async','/plan/async','/operations/:operationId','/operations/:operationId/cancel'])if(!route.includes(x)){console.error('Missing analyzer route:',x);process.exit(1)}
          NODE
      - name: Verify secure OTP generation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['backend/src/routes/auth.js','backend/src/routes/auth-recovery.js','backend/src/routes/account-change-flows.js','backend/src/routes/account-recovery-email.js','backend/src/routes/account-profile.js'];
          for(const p of files){const s=fs.readFileSync(p,'utf8');if(s.includes('Math.random')){console.error('Insecure OTP generation:',p);process.exit(1)}}
          NODE
