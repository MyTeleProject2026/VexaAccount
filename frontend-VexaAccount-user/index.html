<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="VexaAccount central identity and account center">
  <title>VexaAccount — Account Center</title>
  <link rel="stylesheet" href="./src/styles.css?v=20260831">
</head>
<body>
  <div id="app">
    <main class="shell loading-shell">
      <section class="card glass loading-card">
        <div class="brand-mark">V</div>
        <p class="eyebrow">VEXA ACCOUNT</p>
        <h1>Loading Account Center…</h1>
        <p class="muted">Connecting to your VexaAccount session.</p>
        <div class="loading-bar" aria-hidden="true"><span></span></div>
      </section>
    </main>
  </div>
  <script>
    // Remove stale service-worker/cache state that can keep an older Account Center shell alive.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => registrations.forEach(registration => registration.unregister())).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(() => {});
    }
  </script>
  <script src="./src/app.js?v=20260831" defer></script>
</body>
</html>
