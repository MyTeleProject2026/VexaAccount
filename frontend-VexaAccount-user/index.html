<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>VexaAccount</title></head><body><main><header><div><p class="eyebrow">VEXA ECOSYSTEM</p><h1>My VexaAccount</h1></div><button id="logoutBtn" class="ghost">Sign out</button></header><section id="authView" class="card"><h2>Secure Account Center</h2><p>Sign in with your VexaAccount access token to manage your profile, security, connected apps, SSO permissions and sessions.</p><input id="tokenInput" type="password" placeholder="Paste access token"><button id="connectBtn">Connect Account</button></section><section id="appView" hidden><div id="profile" class="card"></div><section class="card"><h2>Edit Profile</h2><form id="profileForm"><input name="name" placeholder="Full name"><input name="firstName" placeholder="First name"><input name="lastName" placeholder="Last name"><input name="phone" placeholder="Phone"><input name="country" placeholder="Country"><textarea name="bio" placeholder="Bio"></textarea><button>Save Profile</button></form></section><div class="grid"><div class="card"><h2>Security</h2><div id="security"></div></div><div class="card"><h2>Connected Apps</h2><div id="apps"></div></div></div><div class="grid"><div class="card"><h2>SSO Permissions</h2><div id="consents"></div></div><div class="card"><h2>Active SSO Sessions</h2><div id="sessions"></div></div></div><div class="card"><h2>Security Activity</h2><div id="activity"></div></div></section></main><script src="./config.js"></script><script src="./app.js"></script></body></html>
