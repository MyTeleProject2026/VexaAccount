<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050811"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="/brand.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/brand.svg"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/auth.css"><title>Create account — VexaAccount</title></head><body><main class="auth"><section class="auth-card"><img class="logo" src="/brand.svg" alt="VexaAccount"><p class="eyebrow">VEXA ACCOUNT</p><h1>Create your account</h1><p class="lead">One secure identity for the Vexa ecosystem.</p><div id="message" class="message"></div><form id="register"><label class="field">Full name<input name="name" autocomplete="name" placeholder="Your name" required></label><label class="field">Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field">Password<input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label><label class="field">Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required></label><button class="submit" type="submit">Create account</button></form><div class="links"><a href="/login.html">Already have an account? Sign in</a><span>·</span><a href="/">Account Center</a></div></section></main><script>const API='https://api-vexaaccount.onrender.com',m=document.getElementById('message');const show=(t,s=false)=>{m.textContent=t;m.className='message show'+(s?' success':'')};document.getElementById('register').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('password')!==f.get('confirmPassword'))return show('Passwords do not match.');const b=e.target.querySelector('button');b.disabled=true;b.textContent='Creating account…';try{const r=await fetch(API+'/api/auth/register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),email:f.get('email'),password:f.get('password')})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.message||'Unable to create account');show(d.message||'Account created. Check your email for verification.',true);setTimeout(()=>location.href='/login.html',1400)}catch(err){show(err.message)}finally{b.disabled=false;b.textContent='Create account'}};</script></body></html>
