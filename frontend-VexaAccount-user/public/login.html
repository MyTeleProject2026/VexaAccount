<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050811"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="/brand.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/brand.svg"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/auth.css"><title>Sign in — VexaAccount</title></head><body><main class="auth"><section class="auth-card"><img class="logo" src="/brand.svg" alt="VexaAccount"><p class="eyebrow">VEXA ACCOUNT</p><h1>Welcome back</h1><p class="lead">Sign in securely to your central VexaAccount.</p><div id="message" class="message"></div><form id="login"><label class="field">Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" placeholder="Your password" required></label><button class="submit" type="submit">Sign in securely</button></form><div class="links"><a href="/register.html">Create an account</a><span>·</span><a href="/">Account Center</a></div></section></main><script>const API='https://api-vexaaccount.onrender.com',m=document.getElementById('message');const show=(t,s=false)=>{m.textContent=t;m.className='message show'+(s?' success':'')};document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Signing in…';try{const r=await fetch(API+'/api/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.message||'Unable to sign in');if(d.requiresEmail2fa||d.requiresAuthenticator2fa){show('Two-factor verification is required. Continue through the VexaAccount verification flow.',false);sessionStorage.setItem('vexa_pending_auth',JSON.stringify(d));return}location.href='/'}catch(err){show(err.message)}finally{b.disabled=false;b.textContent='Sign in securely'}};</script></body></html>
