<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VexaAccount - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050812; }
        .glass { background: rgba(10,14,26,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .gradient-text { background: linear-gradient(135deg, #06b6d4, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input:focus { border-color: #06b6d4 !important; outline: none; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
        .btn-loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-cyan-500/10 px-4 py-2 rounded-full border border-cyan-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-8 h-8">
                    <defs>
                        <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#06b6d4"/>
                            <stop offset="100%" stop-color="#10b981"/>
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" rx="20" ry="20" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
                    <g transform="translate(50, 50) scale(0.8)">
                        <path d="M-25,-25 L-5,15 L5,15 L25,-25" fill="none" stroke="url(#vGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M25,-25 L5,15" fill="none" stroke="url(#vGrad)" stroke-width="6" stroke-linecap="round"/>
                        <path d="M-12,22 L0,30 L12,22" fill="none" stroke="url(#vGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="0" cy="-28" r="4" fill="#06b6d4"/>
                        <circle cx="0" cy="-28" r="8" fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
                    </g>
                    <circle cx="30" cy="30" r="20" fill="rgba(255,255,255,0.03)"/>
                </svg>
                <span class="text-sm text-cyan-300 font-medium">VexaAccount</span>
            </div>
            <h1 class="text-3xl font-bold gradient-text mt-4">Welcome Back</h1>
            <p class="text-slate-400 text-sm mt-1">Sign in to access all Vexa apps</p>
        </div>

        <div id="loginContainer" class="glass rounded-3xl p-8 shadow-2xl">
            <!-- Normal Login Form -->
            <form id="loginForm" class="space-y-4">
                <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300"></div>
                <div id="successMessage" class="hidden bg-emerald-500/10 border border-emerald-500/20 rounded-2xl px-4 py-3 text-sm text-emerald-300"></div>
                
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" class="w-full bg-[#050812] border border-white/10 rounded-2xl px-4 py-4 text-white placeholder:text-slate-600 focus:border-cyan-500 transition" required autocomplete="email" />
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-2">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" class="w-full bg-[#050812] border border-white/10 rounded-2xl px-4 py-4 text-white placeholder:text-slate-600 focus:border-cyan-500 transition" required autocomplete="current-password" />
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl py-4 transition disabled:opacity-60">Sign In</button>
            </form>

            <div class="mt-3 text-right"><a href="/auth/forgot-password" class="text-sm text-cyan-400 hover:underline">Forgot password?</a></div>

            <div class="mt-6 text-center text-sm text-slate-400">
                Don't have an account? <a href="/auth/register-page" class="text-cyan-400 hover:underline">Create one</a>
            </div>

            <div class="mt-8 rounded-2xl border border-white/10 bg-white/[0.03] p-4">
                <div class="text-xs uppercase tracking-wider text-slate-500">Security</div>
                <div class="mt-2 text-sm text-slate-400">Your Vexa Account works across all Vexa apps</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUri = urlParams.get('redirect_uri') || 'https://vexatrade-v.2bd.net/auth/callback';
            const twofaUserId = urlParams.get('2fa'); // <-- new: detect 2fa parameter

            console.log('🔐 [login.html] Page loaded');
            console.log('🔐 [login.html] Redirect URI:', redirectUri);
            console.log('🔐 [login.html] 2FA user ID:', twofaUserId);

            // ============================================================
            // ✅ If 2FA parameter is present, show 2FA input immediately
            // ============================================================
            if (twofaUserId) {
                // Hide the login form and show 2FA input
                show2faInput(twofaUserId);
            }

            // ============================================================
            // Normal login form handler
            // ============================================================
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            if (!form) {
                console.error('🔐 [login.html] Form not found!');
                return;
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                console.log('🔐 [login.html] Form submit intercepted');

                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                errorDiv.className = 'hidden';

                if (!email || !password) {
                    errorDiv.textContent = 'Please enter both email and password';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.textContent = 'Signing in...';
                loginBtn.className = 'w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl py-4 transition disabled:opacity-60 btn-loading';

                try {
                    const payload = { email, password, redirectUri };
                    console.log('🔐 [login.html] Sending POST to /api/auth/login with payload:', payload);

                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    console.log('🔐 [login.html] Response status:', response.status);
                    const data = await response.json();
                    console.log('🔐 [login.html] Response data:', data);

                    if (data.success === true && data.token) {
                        const redirectUrl = new URL(redirectUri);
                        redirectUrl.searchParams.set('token', data.token);
                        if (data.user) {
                            redirectUrl.searchParams.set('user', JSON.stringify(data.user));
                        }
                        console.log('🔐 [login.html] Redirecting to:', redirectUrl.toString());
                        window.location.href = redirectUrl.toString();
                        return;
                    }

                    if (data.requiresAuthenticator2fa) {
                        show2faInput(data.userId);
                        return;
                    }

                    if (data.requiresEmail2fa) {
                        showOtpInput(data.userId);
                        return;
                    }

                    errorDiv.textContent = data.message || 'Login failed. Please try again.';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    loginBtn.className = 'w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl py-4 transition';

                } catch (err) {
                    console.error('🔐 [login.html] Fetch error:', err);
                    errorDiv.textContent = 'Network error. Please check your connection and try again.';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    loginBtn.className = 'w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl py-4 transition';
                }
            });

            // ============================================================
            // ✅ 2FA UI Handler (Authenticator App)
            // ============================================================
            function show2faInput(userId) {
                const container = document.getElementById('loginContainer');
                container.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="w-16 h-16 rounded-full bg-cyan-500/10 flex items-center justify-center mx-auto mb-3">
                            <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">2FA Verification</h2>
                        <p class="text-slate-400 text-sm mt-1">Enter your authenticator code</p>
                    </div>
                    <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300"></div>
                    <input type="text" id="otpCode" placeholder="000000" maxlength="6" class="w-full bg-[#050812] border border-white/10 rounded-2xl px-4 py-4 text-center text-2xl tracking-widest text-white focus:border-cyan-500 transition" required autofocus />
                    <button onclick="verify2fa('${userId}')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl py-4 transition">Verify & Login</button>
                    <div class="mt-4 text-center"><a href="/auth/login-page" class="text-sm text-slate-400 hover:text-white">Back to Login</a></div>
                    <div class="mt-8 rounded-2xl border border-white/10 bg-white/[0.03] p-4">
                        <div class="text-xs uppercase tracking-wider text-slate-500">Security</div>
                        <div class="mt-2 text-sm text-slate-400">Your Vexa Account works across all Vexa apps</div>
                    </div>
                `;
            }

            // ============================================================
            // ✅ Email OTP UI Handler
            // ============================================================
            function showOtpInput(userId) {
                const container = document.getElementById('loginContainer');
                container.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="w-16 h-16 rounded-full bg-cyan-500/10 flex items-center justify-center mx-auto mb-3">
                            <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">Email Verification</h2>
                        <p class="text-slate-400 text-sm mt-1">Enter the OTP sent to your email</p>
                    </div>
                    <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300"></div>
                    <input type="text" id="otpCode" placeholder="000000" maxlength="6" class="w-full bg-[#050812] border border-white/10 rounded-2xl px-4 py-4 text-center text-2xl tracking-widest text-white focus:border-cyan-500 transition" required autofocus />
                    <button onclick="verifyOtp('${userId}')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl py-4 transition">Verify & Login</button>
                    <div class="mt-4 text-center"><a href="/auth/login-page" class="text-sm text-slate-400 hover:text-white">Back to Login</a></div>
                    <div class="mt-8 rounded-2xl border border-white/10 bg-white/[0.03] p-4">
                        <div class="text-xs uppercase tracking-wider text-slate-500">Security</div>
                        <div class="mt-2 text-sm text-slate-400">Your Vexa Account works across all Vexa apps</div>
                    </div>
                `;
            }

            // ============================================================
            // ✅ 2FA Verification (Authenticator)
            // ============================================================
            window.verify2fa = async function(userId) {
                const otp = document.getElementById('otpCode').value;
                const errorDiv = document.getElementById('errorMessage');
                
                if (!otp || otp.length !== 6) {
                    errorDiv.textContent = 'Please enter a valid 6-digit code';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                errorDiv.className = 'hidden';

                try {
                    const response = await fetch('/api/auth/twofa/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, token: otp })
                    });
                    
                    const data = await response.json();
                    console.log('🔐 [login.html] 2FA Response:', data);

                    if (data.success) {
                        const redirectUrl = new URL(redirectUri);
                        redirectUrl.searchParams.set('token', data.token);
                        if (data.user) redirectUrl.searchParams.set('user', JSON.stringify(data.user));
                        window.location.href = redirectUrl.toString();
                    } else {
                        errorDiv.textContent = data.message || 'Invalid code';
                        errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                        errorDiv.classList.remove('hidden');
                    }
                } catch (err) {
                    console.error('2FA error:', err);
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                }
            };

            // ============================================================
            // ✅ Email OTP Verification
            // ============================================================
            window.verifyOtp = async function(userId) {
                const otp = document.getElementById('otpCode').value;
                const errorDiv = document.getElementById('errorMessage');
                
                if (!otp || otp.length !== 6) {
                    errorDiv.textContent = 'Please enter a valid 6-digit OTP';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                errorDiv.className = 'hidden';

                try {
                    const response = await fetch('/api/auth/verify-email-2fa', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, otp })
                    });
                    
                    const data = await response.json();
                    console.log('🔐 [login.html] OTP Response:', data);

                    if (data.success) {
                        const redirectUrl = new URL(redirectUri);
                        redirectUrl.searchParams.set('token', data.token);
                        if (data.user) redirectUrl.searchParams.set('user', JSON.stringify(data.user));
                        window.location.href = redirectUrl.toString();
                    } else {
                        errorDiv.textContent = data.message || 'Invalid OTP';
                        errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                        errorDiv.classList.remove('hidden');
                    }
                } catch (err) {
                    console.error('OTP error:', err);
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                }
            };
        })();
    </script>
</body>
</html>
