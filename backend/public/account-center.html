<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VexaAccount — Account Center</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#08090d;color:#f5f6fa;--p:#11131b;--l:#252936;--a:#8bb8ff;--m:#9da3b4;--d:#ffaaaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#172236 0,#08090d 45%)}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:900;font-size:20px}.logo b{color:var(--a)}.panel{background:#11131bef;border:1px solid var(--l);border-radius:18px;padding:20px;margin-top:14px}.hero h1{font-size:34px;margin:8px 0}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--l);border-radius:14px;padding:15px}.row{padding:13px 0;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border:0}.badge{padding:4px 8px;border-radius:20px;background:#18231b;color:#bde4c6;font-size:12px}.danger{border-color:#633434;color:var(--d)}button{background:#20232d;color:#fff;border:1px solid #343846;padding:9px 12px;border-radius:9px;cursor:pointer}.empty{text-align:center;padding:20px;color:var(--m)}.code{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">Vexa<b>Account</b></div><div><span id="email" class="muted"></span> <button id="logout">Logout</button></div></header><section class="panel hero"><div class="muted">Central account</div><h1>Connected apps, sessions & security.</h1><p class="muted">Control your VexaAccount SSO access from one place. Revoking an app also ends its active SSO sessions.</p></section><div class="grid"><section class="panel"><h2>Connected Applications</h2><div id="apps"></div></section><section class="panel"><h2>Active SSO Sessions</h2><div id="sessions"></div></section></div><section class="panel"><h2>Recent Security Activity</h2><div id="events"></div></section></div><script>
const api=(p,o={})=>fetch(p,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d});const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const s=await api('/api/auth/session');if(!s.success){location.href='/auth/login-page?next=/auth/account-center';return}$('email').textContent=s.user.email;const [a,se,e]=await Promise.all([api('/api/account/apps'),api('/api/account/sessions'),api('/api/account/security/events?limit=50')]);$('apps').innerHTML=(a.applications||[]).length?(a.applications||[]).map(x=>`<div class="row"><div><b>${esc(x.display_name)}</b><div class="muted">${esc(x.description||x.application_key)}</div><div class="muted small">Scopes: ${esc((x.scopes||'').toString())}</div></div>${x.status==='active'?`<button class="danger" data-revoke="${esc(x.client_id)}">Revoke</button>`:`<span class="badge">${esc(x.status)}</span>`}</div>`).join(''):'<div class="empty">No connected applications.</div>';$('sessions').innerHTML=(se.sessions||[]).length?(se.sessions||[]).map(x=>`<div class="row"><div><b>${esc(x.client_id)}</b><div class="muted">${esc(x.scope||'')} · expires ${esc(x.expires_at)}</div></div><button class="danger" data-session="${esc(x.id)}">Revoke</button></div>`).join(''):'<div class="empty">No active SSO sessions.</div>';$('events').innerHTML=(e.events||[]).length?(e.events||[]).map(x=>`<div class="row"><div><b>${esc(x.event_type)}</b><div class="muted">${esc(x.client_id||'VexaAccount')} · ${esc(x.ip_address||'')}</div></div><span class="muted">${esc(x.created_at)}</span></div>`).join(''):'<div class="empty">No security events.</div>'}
$('apps').addEventListener('click',async e=>{const b=e.target.closest('[data-revoke]');if(!b)return;if(confirm('Revoke this application access?')){await api('/api/account/apps/'+encodeURIComponent(b.dataset.revoke)+'/consent',{method:'DELETE'});await load()}});$('sessions').addEventListener('click',async e=>{const b=e.target.closest('[data-session]');if(!b)return;if(confirm('Revoke this SSO session?')){await api('/api/account/sessions/'+encodeURIComponent(b.dataset.session),{method:'DELETE'});await load()}});$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/auth/login-page'};load().catch(()=>location.href='/auth/login-page');
</script></body></html>
