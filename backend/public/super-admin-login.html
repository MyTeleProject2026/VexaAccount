<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VexaAccount Super Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090d;color:#fff;font-family:Inter,system-ui,sans-serif}.card{width:min(430px,calc(100% - 32px));padding:32px;border:1px solid #292d38;border-radius:20px;background:#11131b;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px}.muted{color:#9da3b4}.form{display:grid;gap:14px;margin-top:24px}label{font-size:13px;color:#9da3b4}input{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #343846;background:#0b0d12;color:#fff}button{padding:13px;border:0;border-radius:10px;background:#d9b86c;color:#17140c;font-weight:800;cursor:pointer}.error{margin-top:12px;padding:10px;border-radius:9px;background:#291919;color:#ffb0b0}.hidden{display:none}.brand{font-weight:900;font-size:20px}.brand b{color:#d9b86c}</style></head><body><main class="card"><div class="brand">Vexa<b>Account</b> / Super Admin</div><h1>Sign in</h1><div class="muted">Use the Super Admin credentials configured on the VexaAccount backend.</div><div id="error" class="error hidden"></div><form id="form" class="form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Sign in to Super Admin</button></form></main><script>const qs=new URLSearchParams(location.search);const next=qs.get('next')||'/auth/super-admin';const error=document.getElementById('error');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();error.classList.add('hidden');const button=document.getElementById('submit');button.disabled=true;button.textContent='Signing in…';try{const r=await fetch('/api/auth/super-admin/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'include',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Super Admin login failed');location.href=next}catch(err){error.textContent=err.message;error.classList.remove('hidden');button.disabled=false;button.textContent='Sign in to Super Admin'}});</script></body></html>
