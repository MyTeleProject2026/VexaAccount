<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VexaAccount - Verify OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050812; }
        .glass { background: rgba(10,14,26,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .gradient-text { background: linear-gradient(135deg, #06b6d4, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input:focus { border-color: #06b6d4 !important; outline: none; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-cyan-500/10 px-4 py-2 rounded-full border border-cyan-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-8 h-8">
                    <defs>
                        <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#06b6d4"/>
                            <stop offset="100%" stop-color="#10b981"/>
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" rx="20" ry="20" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
                    <g transform="translate(50, 50) scale(0.8)">
                        <path d="M-25,-25 L-5,15 L5,15 L25,-25" fill="none" stroke="url(#vGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M25,-25 L5,15" fill="none" stroke="url(#vGrad)" stroke-width="6" stroke-linecap="round"/>
                        <path d="M-12,22 L0,30 L12,22" fill="none" stroke="url(#vGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="0" cy="-28" r="4" fill="#06b6d4"/>
                        <circle cx="0" cy="-28" r="8" fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
                    </g>
                    <circle cx="30" cy="30" r="20" fill="rgba(255,255,255,0.03)"/>
                </svg>
                <span class="text-sm text-cyan-300 font-medium">VexaAccount</span>
            </div>
            <h1 class="text-3xl font-bold gradient-text mt-4">Verify OTP</h1>
            <p class="text-slate-400 text-sm mt-1">Enter the 6-digit code sent to your email</p>
        </div>

        <div class="glass rounded-3xl p-8 shadow-2xl">
            <form id="otpForm" class="space-y-4">
                <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300"></div>
                
                <div>
                    <label class="block text-sm text-slate-400 mb-2">OTP Code</label>
                    <input type="text" id="otpCode" maxlength="6" placeholder="000000" class="w-full bg-[#050812] border border-white/10 rounded-2xl px-4 py-4 text-center text-2xl tracking-widest text-white focus:border-cyan-500 transition" required autofocus />
                </div>

                <button type="submit" id="verifyBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl py-4 transition disabled:opacity-60">
                    Verify
                </button>
            </form>

            <div class="mt-4 text-center">
                <button id="resendBtn" class="text-sm text-cyan-400 hover:underline disabled:opacity-50">
                    Resend OTP
                </button>
                <span class="text-xs text-slate-500 ml-2">(expires in 10 min)</span>
            </div>

            <p class="mt-6 text-center text-xs text-slate-500">
                Didn't receive the code? Check your spam folder.
                <br />
                <span class="text-slate-600">If you still don't see it, try resending.</span>
            </p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || '';
        const redirectUri = urlParams.get('redirect_uri') || 'https://vexatrade-v.2bd.net/auth/callback';

        console.log('📧 [otp-verify.html] Page loaded for:', email);

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const otp = document.getElementById('otpCode').value;
            const errorDiv = document.getElementById('errorMessage');
            const verifyBtn = document.getElementById('verifyBtn');

            errorDiv.className = 'hidden';
            
            if (!otp || otp.length !== 6) {
                errorDiv.textContent = 'Please enter a valid 6-digit OTP';
                errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                errorDiv.classList.remove('hidden');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await response.json();
                console.log('📧 [otp-verify.html] OTP response:', data);

                if (data.success) {
                    const redirectUrl = new URL(redirectUri);
                    redirectUrl.searchParams.set('token', data.token);
                    if (data.user) redirectUrl.searchParams.set('user', JSON.stringify(data.user));
                    window.location.href = redirectUrl.toString();
                } else {
                    errorDiv.textContent = data.message || 'Invalid OTP. Please try again.';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify';
                }
            } catch (err) {
                console.error('❌ [otp-verify.html] Error:', err);
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                errorDiv.classList.remove('hidden');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify';
            }
        });

        document.getElementById('resendBtn').addEventListener('click', async function() {
            const btn = this;
            const errorDiv = document.getElementById('errorMessage');
            
            btn.disabled = true;
            btn.textContent = 'Sending...';
            errorDiv.className = 'hidden';

            try {
                const response = await fetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                console.log('📧 [otp-verify.html] Resend response:', data);

                if (data.success) {
                    btn.textContent = '✓ Resent!';
                    setTimeout(() => {
                        btn.textContent = 'Resend OTP';
                        btn.disabled = false;
                    }, 3000);
                } else {
                    errorDiv.textContent = data.message || 'Failed to resend OTP';
                    errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                    errorDiv.classList.remove('hidden');
                    btn.textContent = 'Resend OTP';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error('❌ [otp-verify.html] Resend error:', err);
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
                errorDiv.classList.remove('hidden');
                btn.textContent = 'Resend OTP';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
