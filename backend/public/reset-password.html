<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VexaAccount - Choose New Password</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#050812] text-white flex items-center justify-center p-4"><main class="w-full max-w-md rounded-3xl border border-white/10 bg-white/[0.03] p-7 shadow-2xl"><p class="text-cyan-300 text-xs font-bold tracking-[.25em]">VEXA ACCOUNT</p><h1 class="mt-3 text-3xl font-bold">Choose a new password</h1><p class="mt-2 text-sm text-slate-400">Use a strong password with at least 8 characters.</p><form id="form" class="mt-7 space-y-4"><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="New password" class="w-full rounded-2xl border border-white/10 bg-[#050812] px-4 py-4 outline-none focus:border-cyan-500"><input id="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Confirm new password" class="w-full rounded-2xl border border-white/10 bg-[#050812] px-4 py-4 outline-none focus:border-cyan-500"><button id="btn" class="w-full rounded-2xl bg-cyan-500 py-4 font-bold text-black">Reset password</button></form><p id="msg" class="mt-4 text-center text-sm text-slate-300"></p></main><script>const token=new URLSearchParams(location.search).get('token');const m=document.getElementById('msg');if(!token){m.textContent='This reset link is invalid or incomplete.';m.className='mt-4 text-center text-sm text-red-300';document.getElementById('btn').disabled=true}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value,b=document.getElementById('btn');if(p!==c){m.textContent='Passwords do not match.';m.className='mt-4 text-center text-sm text-red-300';return}b.disabled=true;b.textContent='Resetting…';try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:p})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Reset failed');m.textContent='Password reset successfully. Redirecting to sign in…';m.className='mt-4 text-center text-sm text-emerald-300';setTimeout(()=>location.href='/auth/login-page',1200)}catch(err){m.textContent=err.message||'Unable to reset password.';m.className='mt-4 text-center text-sm text-red-300';b.disabled=false;b.textContent='Reset password'}})</script></body></html>
