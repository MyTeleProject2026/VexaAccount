<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VexaAccount - Reset Password</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#050812] text-white flex items-center justify-center p-4"><main class="w-full max-w-md rounded-3xl border border-white/10 bg-white/[0.03] p-7 shadow-2xl"><p class="text-cyan-300 text-xs font-bold tracking-[.25em]">VEXA ACCOUNT</p><h1 class="mt-3 text-3xl font-bold">Reset your password</h1><p class="mt-2 text-sm text-slate-400">Enter your email and we'll send you a secure password reset link.</p><form id="form" class="mt-7 space-y-4"><input id="email" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full rounded-2xl border border-white/10 bg-[#050812] px-4 py-4 outline-none focus:border-cyan-500"><button id="btn" class="w-full rounded-2xl bg-cyan-500 py-4 font-bold text-black">Send reset link</button></form><p id="msg" class="mt-4 text-center text-sm text-slate-300"></p><p class="mt-6 text-center text-sm text-slate-400"><a class="text-cyan-400 hover:underline" href="/auth/login-page">Back to sign in</a></p></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn'),m=document.getElementById('msg');b.disabled=true;b.textContent='Sending…';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();m.textContent=d.message||'Please check your email.';m.className='mt-4 text-center text-sm text-emerald-300'}catch{m.textContent='Unable to send the reset link. Please try again.';m.className='mt-4 text-center text-sm text-red-300'}finally{b.disabled=false;b.textContent='Send reset link'}})</script></body></html>
