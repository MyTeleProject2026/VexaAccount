<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - VexAccount</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f8fa; display:flex; align-items:center; justify-content:center; height:100vh; margin:0 }
    .card { background:#fff; padding:24px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); width:360px }
    input { width:100%; padding:8px 10px; margin:8px 0; box-sizing:border-box }
    button { width:100%; padding:10px; margin-top:12px; background:#28a745; color:#fff; border:none; border-radius:4px }
    a { display:block; margin-top:12px; text-align:center; color:#0366d6; text-decoration:none }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <form id="registerForm" action="/auth/register" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Register</button>
    </form>
    <a href="/public/login.html">Already have an account? Sign in</a>
  </div>
</body>
</html>
