<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VexaAccount - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050812; }
        .glass { background: rgba(10,14,26,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .gradient-text { background: linear-gradient(135deg, #06b6d4, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input:focus, select:focus { border-color: #06b6d4 !important; outline: none; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center gap-2 bg-cyan-500/10 px-4 py-2 rounded-full border border-cyan-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-8 h-8">
                    <defs>
                        <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#06b6d4"/>
                            <stop offset="100%" stop-color="#10b981"/>
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" rx="20" ry="20" fill="#0a0e1a" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
                    <g transform="translate(50, 50) scale(0.8)">
                        <path d="M-25,-25 L-5,15 L5,15 L25,-25" fill="none" stroke="url(#vGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M25,-25 L5,15" fill="none" stroke="url(#vGrad)" stroke-width="6" stroke-linecap="round"/>
                        <path d="M-12,22 L0,30 L12,22" fill="none" stroke="url(#vGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="0" cy="-28" r="4" fill="#06b6d4"/>
                        <circle cx="0" cy="-28" r="8" fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
                    </g>
                    <circle cx="30" cy="30" r="20" fill="rgba(255,255,255,0.03)"/>
                </svg>
                <span class="text-sm text-cyan-300 font-medium">VexaAccount</span>
            </div>
            <h1 class="text-3xl font-bold gradient-text mt-2">Create Account</h1>
            <p class="text-slate-400 text-sm">One account for all Vexa apps</p>
        </div>

        <div class="glass rounded-3xl p-6 shadow-2xl">
            <form id="registerForm" class="space-y-3">
                <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300"></div>
                <div id="successMessage" class="hidden bg-emerald-500/10 border border-emerald-500/20 rounded-2xl px-4 py-3 text-sm text-emerald-300"></div>
                
                <!-- First & Last Name -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">First Name</label>
                        <input type="text" id="firstName" placeholder="John" class="w-full bg-[#050812] border border-white/10 rounded-xl px-4 py-3 text-white placeholder:text-slate-600 focus:border-cyan-500 transition" required />
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Last Name</label>
                        <input type="text" id="lastName" placeholder="Doe" class="w-full bg-[#050812] border border-white/10 rounded-xl px-4 py-3 text-white placeholder:text-slate-600 focus:border-cyan-500 transition" required />
                    </div>
                </div>

                <!-- Gender & DOB -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Gender</label>
                        <select id="gender" class="w-full bg-[#050812] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-500 transition">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Date of Birth</label>
                        <input type="date" id="dob" class="w-full bg-[#050812] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-500 transition" />
                    </div>
                </div>

                <!-- Country -->
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Country</label>
                    <select id="country" class="w-full bg-[#050812] border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-500 transition">
                        <option value="">Select your country</option>
                        <option value="US">United States</option>
                        <option value="GB">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                        <option value="IN">India</option>
                        <!-- add more as needed -->
                    </select>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" class="w-full bg-[#050812] border border-white/10 rounded-xl px-4 py-3 text-white placeholder:text-slate-600 focus:border-cyan-500 transition" required />
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Password</label>
                    <input type="password" id="password" placeholder="Min 6 characters" class="w-full bg-[#050812] border border-white/10 rounded-xl px-4 py-3 text-white placeholder:text-slate-600 focus:border-cyan-500 transition" required />
                </div>

                <button type="submit" id="registerBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-xl py-3 transition disabled:opacity-60">
                    Create Account
                </button>
            </form>

            <div class="mt-4 text-center text-sm text-slate-400">
                Already have an account? <a href="/auth/login-page" class="text-cyan-400 hover:underline">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUri = urlParams.get('redirect_uri') || 'https://vexatrade-v.2bd.net/auth/callback';

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const gender = document.getElementById('gender').value;
            const dob = document.getElementById('dob').value;
            const country = document.getElementById('country').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const name = `${firstName} ${lastName}`.trim();
            
            const errorDiv = document.getElementById('errorMessage');
            const registerBtn = document.getElementById('registerBtn');

            errorDiv.className = 'hidden';

            if (!firstName) { showError('First name is required'); return; }
            if (!lastName) { showError('Last name is required'); return; }
            if (!gender) { showError('Gender is required'); return; }
            if (!dob) { showError('Date of birth is required'); return; }
            if (!country) { showError('Country is required'); return; }
            if (!email) { showError('Email is required'); return; }
            if (!password || password.length < 6) { showError('Password must be at least 6 characters'); return; }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, firstName, lastName, gender, dob, country, email, password 
                    })
                });

                const data = await response.json();
                console.log('📥 Register response:', data);

                if (data.success) {
                    // ✅ FIX: Always redirect to OTP verification after successful registration
                    const otpUrl = `/auth/otp-verify.html?email=${encodeURIComponent(email)}&redirect_uri=${encodeURIComponent(redirectUri)}`;
                    console.log('🔐 [register.html] Redirecting to OTP:', otpUrl);
                    window.location.href = otpUrl;
                } else {
                    showError(data.message || 'Registration failed');
                }
            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        });

        function showError(msg) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = msg;
            errorDiv.className = 'bg-red-500/10 border border-red-500/20 rounded-2xl px-4 py-3 text-sm text-red-300';
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
