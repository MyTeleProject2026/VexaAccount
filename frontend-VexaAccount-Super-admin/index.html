(()=>{
  const assets=['sso-integration-generator.js','sso-runtime-sync.js','sso-status-sync.js','sso-integration-factory-v4.js','sso-github-deployer.js'];
  const loaded=new Set();
  const load=()=>{
    if(window.__VEXA_OWNER_BOOT_STATE__!=='ready')return;
    for(const file of assets){if(loaded.has(file)||document.querySelector(`script[data-owner-deferred="${file}"]`))continue;loaded.add(file);const s=document.createElement('script');s.src='/src/'+file+'?owner_deferred=20260908-01';s.defer=true;s.dataset.ownerDeferred=file;document.head.appendChild(s)}
  };
  const timer=setInterval(()=>{load();if(window.__VEXA_OWNER_BOOT_STATE__==='ready')clearInterval(timer)},250);
  setTimeout(()=>clearInterval(timer),30000);
})();
</script><script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(reg=>reg.unregister()))).catch(()=>{});
  if(window.caches){caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('vexaaccount-admin-shell-')).map(k=>caches.delete(k)))).catch(()=>{});}
}
</script></body></html>
